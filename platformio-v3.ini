; Experimental Arduino-ESP32 3.x (ESP-IDF 5) build of the same firmware.
; Not the release build - platformio.ini (Arduino 2.x) stays that until 3.x is proven.
;
; pioarduino can't share a PlatformIO core with the official 2.x platform (both
; install a package called framework-arduinoespressif32, and building one overwrites
; the other), so it is kept out of platformio.ini, where VS Code would pick it up,
; and built with its own core directory:
;
;   PLATFORMIO_CORE_DIR=~/.platformio-arduino3 pio run -c platformio-v3.ini
;   PLATFORMIO_CORE_DIR=~/.platformio-arduino3 pio run -c platformio-v3.ini -t upload --upload-port <port>

[platformio]
default_envs = klaussometer-v3

[env:klaussometer-v3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	moononournation/GFX Library for Arduino@^1.6.5
	arduino-libraries/ArduinoMqttClient@^0.1.8
	bblanchon/ArduinoJson@^7.4.2
	lvgl/lvgl@9.5.0 ; Same LVGL as the 2.x build so only the framework differs
; No lib_ignore = Time here, unlike platformio.ini: pioarduino's component manager
; deletes build-script lines matching ignored library names by loose regex, and "Time"
; matches "-u esp_timer_init_include_func". Without that force-link, esp_timer's early
; init is dropped and the firmware crashes at boot in systimer_hal_enable_alarm_int
; (LoadProhibited at 0x64) - the crash that blocked earlier 3.x upgrade attempts.
; As platformio.ini minus the FreeRTOS/SPIRAM config defines: on 3.x the Arduino core
; is compiled with them but the precompiled ESP-IDF isn't, so they only risk a mismatch
build_flags =
	-Isrc/
	-DLV_CONF_INCLUDE_SIMPLE
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv
build_type = release
