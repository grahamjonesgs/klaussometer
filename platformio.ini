; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the firmware only; the native env is for `pio test -e native`
default_envs = klaussometer

; Firmware — runtime board auto-detection selects Matouch or Waveshare config
[env:klaussometer]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	moononournation/GFX Library for Arduino@1.5.0
	arduino-libraries/ArduinoMqttClient@^0.1.8
	bblanchon/ArduinoJson@^7.4.2
	lvgl/lvgl@^9.4.0
lib_ignore = Time
build_flags =
	-Isrc/
	-DLV_CONF_INCLUDE_SIMPLE
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_SPIRAM_USE_MALLOC=1 ; Forces heap to use PSRAM
	-DconfigGENERATE_RUN_TIME_STATS=1
	-DconfigUSE_STATS_FORMATTING_FUNCTIONS=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_type = release

; Host unit tests for the hardware-free helpers in src/utils.cpp: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<utils.cpp>
build_flags =
	-Isrc/
	-std=c++17
