; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the firmware only; the native env is for `pio test -e native`
default_envs = klaussometer
; pioarduino (Arduino-ESP32 3.x) and the official espressif32 platform both install a
; package called framework-arduinoespressif32, and building one overwrites the other.
; This project keeps its packages in its own core so other projects on espressif32
; 6.x are left alone. See docs/arduino-3-migration.md.
core_dir = ~/.platformio-arduino3

; Firmware — runtime board auto-detection selects Matouch or Waveshare config
; Arduino-ESP32 3.3.6 / ESP-IDF 5.5. Every build is a full rebuild (about 5 minutes).
; For an app-only flash don't use -t nobuild (it breaks pioarduino's upload
; arguments); use esptool write_flash 0x10000 instead.
[env:klaussometer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; Exact versions so a rebuild gets the tested code (the bounce-buffer constructor
; argument is GFX-version specific)
lib_deps =
	moononournation/GFX Library for Arduino@1.6.9
	arduino-libraries/ArduinoMqttClient@0.1.8
	bblanchon/ArduinoJson@7.4.3
	lvgl/lvgl@9.5.0
; Never add lib_ignore = Time: pioarduino's component manager deletes build-script
; lines matching ignored library names by loose regex, and "Time" matches
; "-u esp_timer_init_include_func". Without that force-link, esp_timer's early init
; is dropped and the firmware crashes at boot in systimer_hal_enable_alarm_int
; (LoadProhibited at 0x64).
; No FreeRTOS/SPIRAM config defines: on 3.x the Arduino core is compiled with them
; but the precompiled ESP-IDF isn't, so they only risk a mismatch
build_flags =
	-Isrc/
	-DLV_CONF_INCLUDE_SIMPLE
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv
build_type = release

; Host unit tests for the hardware-free helpers in src/utils.cpp: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<utils.cpp>
build_flags =
	-Isrc/
	-std=c++17
